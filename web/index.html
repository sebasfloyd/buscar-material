<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Buscar material</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d1d1f'/%3E%3Ccircle cx='14.5' cy='14.5' r='6' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M19 19l5 5' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --fondo: #ffffff; --fondo-2: #f5f5f7; --panel: rgba(255,255,255,.82); --panel-solido: #ffffff;
  --texto: #1d1d1f; --texto-2: #6e6e73; --texto-3: #a1a1a6;
  --linea: rgba(0,0,0,.09); --linea-fuerte: rgba(0,0,0,.16);
  --campo: rgba(118,118,128,.12); --campo-foco: #ffffff; --sobre: rgba(0,0,0,.05); --sobre-2: rgba(0,0,0,.09);
  --acento: #0071e3; --acento-suave: rgba(0,113,227,.12); --acento-texto: #0064c8;
  --celda: #ececee; --aviso: #b25000; --aviso-fondo: rgba(255,149,0,.14);
  --sombra-panel: 0 0 0 .5px rgba(0,0,0,.12), 0 12px 40px rgba(0,0,0,.18);
  --sombra-campo: 0 0 0 .5px rgba(0,0,0,.1), 0 8px 28px rgba(0,0,0,.1);
  --fuente: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #1c1c1e; --fondo-2: #242426; --panel: rgba(40,40,42,.82); --panel-solido: #2a2a2c;
    --texto: #f5f5f7; --texto-2: #a1a1a6; --texto-3: #6e6e73;
    --linea: rgba(255,255,255,.1); --linea-fuerte: rgba(255,255,255,.2);
    --campo: rgba(118,118,128,.24); --campo-foco: #2c2c2e; --sobre: rgba(255,255,255,.07); --sobre-2: rgba(255,255,255,.12);
    --acento: #0a84ff; --acento-suave: rgba(10,132,255,.2); --acento-texto: #4da3ff;
    --celda: #2c2c2e; --aviso: #ffb340; --aviso-fondo: rgba(255,159,10,.16);
    --sombra-panel: 0 0 0 .5px rgba(255,255,255,.14), 0 14px 44px rgba(0,0,0,.55);
    --sombra-campo: 0 0 0 .5px rgba(255,255,255,.12), 0 8px 28px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--fondo); color: var(--texto); font: 13px/1.35 var(--fuente); -webkit-font-smoothing: antialiased; overflow: hidden; display: flex; flex-direction: column; cursor: default; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
input { font: inherit; color: inherit; }
svg { display: block; flex: none; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }

/* ---------- cabecera ---------- */
#arriba { position: absolute; top: 10px; right: 14px; display: flex; align-items: center; gap: 2px; z-index: 6; }
.liso { height: 28px; padding: 0 10px; border-radius: 7px; color: var(--texto-2); display: flex; align-items: center; gap: 6px; transition: background .12s, color .12s; }
.liso:hover { background: var(--sobre); color: var(--texto); }
.liso.activo { background: var(--acento-suave); color: var(--acento-texto); }
#indexando { font-variant-numeric: tabular-nums; }
#indexando svg { width: 14px; height: 14px; transform: rotate(-90deg); }
#indexando circle { fill: none; stroke-width: 2.4; }
#indexando .pista { stroke: var(--sobre-2); }
#indexando .avance { stroke: var(--acento); stroke-linecap: round; transition: stroke-dashoffset .5s; }

#cabecera { flex: none; padding: 10px 16px 0; display: flex; flex-direction: column; align-items: center; transition: padding-top .28s cubic-bezier(.2,.8,.2,1); z-index: 5; }
body.inicio #cabecera { padding-top: clamp(64px, 23vh, 240px); }
#campo { width: min(560px, calc(100vw - 420px)); min-width: 280px; height: 36px; border-radius: 10px; background: var(--campo); display: flex; align-items: center; gap: 8px; padding: 0 10px; transition: width .28s cubic-bezier(.2,.8,.2,1), height .28s cubic-bezier(.2,.8,.2,1), background .15s, box-shadow .15s, border-radius .28s; }
#campo:focus-within { background: var(--campo-foco); box-shadow: 0 0 0 3.5px var(--acento-suave), 0 0 0 1px var(--acento); }
#campo > .ico { color: var(--texto-2); width: 17px; height: 17px; }
#q { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; font-size: 14px; user-select: text; -webkit-user-select: text; }
#q::placeholder { color: var(--texto-3); }
#q::-webkit-search-cancel-button { display: none; }
body.inicio #campo { width: min(640px, calc(100vw - 48px)); height: 54px; border-radius: 15px; padding: 0 17px; gap: 12px; background: var(--campo-foco); box-shadow: var(--sombra-campo); }
body.inicio #campo:focus-within { box-shadow: var(--sombra-campo), 0 0 0 3.5px var(--acento-suave); }
body.inicio #campo > .ico { width: 21px; height: 21px; }
body.inicio #q { font-size: 20px; letter-spacing: -.01em; }
#ficha-q { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 3px; border-radius: 6px; background: var(--acento-suave); color: var(--acento-texto); white-space: nowrap; font-size: 12.5px; }
#ficha-q img { width: 18px; height: 18px; border-radius: 4px; object-fit: cover; }
body.inicio #ficha-q { height: 32px; font-size: 14px; border-radius: 8px; padding-right: 10px; }
body.inicio #ficha-q img { width: 26px; height: 26px; border-radius: 6px; }
#limpiar { width: 18px; height: 18px; border-radius: 50%; background: var(--texto-3); color: var(--fondo); display: grid; place-items: center; opacity: .8; }
#limpiar:hover { opacity: 1; }
#limpiar svg { width: 9px; height: 9px; stroke-width: 2.2; }
#atajo { color: var(--texto-3); font-size: 12px; border: 1px solid var(--linea); border-radius: 5px; padding: 1px 5px; }
#campo:focus-within #atajo, body.inicio #atajo { display: none; }

#chips { display: flex; align-items: center; gap: 6px; padding: 10px 0 10px; flex-wrap: wrap; justify-content: center; }
.chip { height: 26px; padding: 0 10px; border-radius: 13px; box-shadow: inset 0 0 0 1px var(--linea); color: var(--texto-2); display: flex; align-items: center; gap: 4px; font-size: 12.5px; transition: background .12s, color .12s, box-shadow .12s; white-space: nowrap; max-width: 240px; }
.chip span { overflow: hidden; text-overflow: ellipsis; }
.chip:hover { background: var(--sobre); color: var(--texto); }
.chip.con { background: var(--acento-suave); color: var(--acento-texto); box-shadow: none; }
.chip svg { width: 9px; height: 9px; stroke-width: 2; opacity: .7; }
.segmento { display: flex; height: 26px; border-radius: 13px; box-shadow: inset 0 0 0 1px var(--linea); padding: 2px; gap: 1px; }
.segmento button { padding: 0 10px; border-radius: 11px; color: var(--texto-2); font-size: 12.5px; transition: background .12s, color .12s; }
.segmento button:hover { color: var(--texto); }
.segmento button.con { background: var(--sobre-2); color: var(--texto); }
.sep-chip { width: 1px; height: 14px; background: var(--linea); margin: 0 4px; }
body.inicio .solo-grilla { display: none; }
body.dups #chips { visibility: hidden; }

/* ---------- inicio ---------- */
#central { flex: 1; position: relative; min-height: 0; }
#inicio { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 18px 24px; opacity: 0; pointer-events: none; transition: opacity .2s; overflow: auto; }
body.inicio #inicio { opacity: 1; pointer-events: auto; }
#ejemplos { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 720px; }
.ejemplo { display: flex; align-items: center; gap: 9px; height: 40px; padding: 0 13px 0 4px; border-radius: 10px; background: var(--fondo-2); color: var(--texto); font-size: 13px; transition: background .12s, transform .12s; }
.ejemplo:hover { background: var(--sobre-2); }
.ejemplo:active { transform: scale(.98); }
.ejemplo img { width: 32px; height: 32px; border-radius: 7px; object-fit: cover; background: var(--celda); }
.ejemplo.solo-texto { padding-left: 13px; }
#resumen { margin-top: 22px; color: var(--texto-2); display: flex; gap: 6px; align-items: center; }
.enlace { color: var(--acento-texto); border-radius: 4px; }
.enlace:hover { text-decoration: underline; }
#vacio-total { margin-top: 6px; text-align: center; max-width: 420px; color: var(--texto-2); line-height: 1.5; }
#vacio-total h2 { color: var(--texto); font-size: 17px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
.boton { height: 30px; padding: 0 14px; border-radius: 8px; background: var(--sobre); color: var(--texto); font-size: 13px; transition: background .12s, filter .12s; white-space: nowrap; }
.boton:hover { background: var(--sobre-2); }
.boton.primario { background: var(--acento); color: #fff; }
.boton.primario:hover { filter: brightness(1.08); }
.boton:disabled { opacity: .45; }

/* ---------- grilla ---------- */
#grilla { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 16px 80px; outline: 0; opacity: 1; transition: opacity .18s; overscroll-behavior: contain; }
body.inicio #grilla, body.dups #grilla { opacity: 0; pointer-events: none; }
#lienzo { position: relative; width: 100%; }
.c { position: absolute; left: 0; top: 0; border-radius: 4px; overflow: hidden; background: var(--celda); contain: strict; }
.c img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .14s; pointer-events: none; }
.c.ok img { opacity: 1; }
.c.sin img { display: none; }
.c .falta { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 8px; color: var(--texto-2); font-size: 11px; text-align: center; }
.c.sin .falta { display: flex; }
.c .falta .ico { width: 22px; height: 22px; opacity: .6; }
.c .falta b { font-weight: 400; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c .dur { position: absolute; left: 5px; bottom: 5px; height: 17px; padding: 0 6px 0 5px; border-radius: 9px; background: rgba(0,0,0,.58); color: #fff; font-size: 10.5px; font-weight: 500; display: none; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; backdrop-filter: blur(6px); }
.c.vid .dur { display: flex; }
.c .dur svg { width: 7px; height: 7px; fill: #fff; }
.c .lejos { position: absolute; left: 5px; top: 5px; width: 19px; height: 19px; border-radius: 50%; background: rgba(0,0,0,.58); color: #fff; display: none; place-items: center; backdrop-filter: blur(6px); }
.c .lejos svg { width: 11px; height: 11px; }
.c.off .lejos { display: grid; }
.c.off img { filter: saturate(.55) opacity(.8); }
.c .marca { position: absolute; right: 5px; top: 5px; width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.95), 0 0 0 .5px rgba(0,0,0,.25); background: rgba(0,0,0,.18); opacity: 0; transition: opacity .1s; display: grid; place-items: center; }
.c .marca svg { width: 10px; height: 10px; stroke: #fff; stroke-width: 2.4; opacity: 0; }
.c:hover .marca { opacity: 1; }
.c.sel .marca { opacity: 1; background: var(--acento); box-shadow: inset 0 0 0 1.5px #fff; }
.c.sel .marca svg { opacity: 1; }
.c::after { content: ""; position: absolute; inset: 0; border-radius: 4px; pointer-events: none; box-shadow: inset 0 0 0 0 transparent; transition: box-shadow .08s; }
.c.sel::after { box-shadow: inset 0 0 0 3px var(--acento); }
.c.cur::after { box-shadow: inset 0 0 0 3px var(--acento), inset 0 0 0 4.5px var(--fondo); }
#grilla:not(:focus) .c.cur:not(.sel)::after { box-shadow: inset 0 0 0 2px var(--linea-fuerte); }
#separador { position: absolute; left: 0; right: 0; height: 44px; display: none; align-items: flex-end; gap: 8px; padding: 0 2px 9px; color: var(--texto-2); font-size: 12px; pointer-events: none; }
#separador b { color: var(--texto); font-weight: 600; font-size: 13px; }
#separador::after { content: ""; flex: 1; height: 1px; background: var(--linea); margin-bottom: 6px; }
.c .usada { position: absolute; right: 5px; bottom: 5px; height: 17px; padding: 0 6px; border-radius: 9px; background: rgba(0,0,0,.58); color: #fff; font-size: 10.5px; font-weight: 500; display: none; align-items: center; backdrop-filter: blur(6px); }
.c.us .usada { display: flex; }
body.con-sel #etq { bottom: 130px; }
#etq { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); z-index: 55; border-radius: 13px; background: var(--panel); backdrop-filter: saturate(1.8) blur(30px); -webkit-backdrop-filter: saturate(1.8) blur(30px); box-shadow: var(--sombra-panel); padding: 12px; animation: subir .16s cubic-bezier(.2,.8,.2,1); }
#etq h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--texto-2); }
#etq .puestas { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
#etq .puestas:empty { display: none; }
.eti { height: 24px; padding: 0 4px 0 9px; border-radius: 12px; background: var(--acento-suave); color: var(--acento-texto); display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; }
.eti.parcial { background: var(--sobre); color: var(--texto-2); }
.eti button { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; opacity: .6; }
.eti button:hover { opacity: 1; background: var(--sobre-2); }
.eti button svg { width: 7px; height: 7px; stroke-width: 2.4; }
#etq .sugeridas { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
#etq .sugeridas:empty { display: none; }
#etq .sugeridas button { height: 24px; padding: 0 9px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--linea); color: var(--texto-2); font-size: 12.5px; }
#etq .sugeridas button:hover, #etq .sugeridas button.foco { background: var(--acento); color: #fff; box-shadow: none; }
#etq .uso { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--linea); color: var(--texto-2); font-size: 12.5px; }
#etq .uso .entrada { height: 26px; font-size: 12.5px; }
#etq .uso span { white-space: nowrap; }
.niveles { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 12px; align-items: center; color: var(--texto-3); }
.niveles button { height: 26px; padding: 0 10px; border-radius: 13px; box-shadow: inset 0 0 0 1px var(--linea); color: var(--texto-2); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.niveles button.con { background: var(--acento-suave); color: var(--acento-texto); box-shadow: none; }
.cli { display: flex; align-items: center; gap: 8px; height: 26px; }
.cli b { flex: 1; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cli span { color: var(--texto-2); font-variant-numeric: tabular-nums; }
#panel h2.otra { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--linea); }
#clientes-lista { max-height: 190px; overflow-y: auto; }
#nada { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 14vh; color: var(--texto-2); text-align: center; pointer-events: none; }
#nada h2 { color: var(--texto); font-size: 17px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
body.inicio #nada, body.dups #nada { display: none; }

/* ---------- duplicados ---------- */
#dups { position: absolute; inset: 0; overflow-y: auto; padding: 4px 24px 80px; opacity: 0; pointer-events: none; transition: opacity .18s; user-select: text; -webkit-user-select: text; }
body.dups #dups { opacity: 1; pointer-events: auto; }
#dups > header { display: flex; align-items: baseline; gap: 10px; padding: 8px 0 14px; max-width: 1100px; margin: 0 auto; }
#dups h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.015em; }
#dups > header span { color: var(--texto-2); }
.grupo { max-width: 1100px; margin: 0 auto; padding: 14px 0; border-top: 1px solid var(--linea); content-visibility: auto; contain-intrinsic-size: 220px; }
.grupo h3 { margin: 0 0 10px; font-size: 12px; font-weight: 500; color: var(--texto-2); display: flex; gap: 8px; align-items: center; }
.grupo h3 b { font-weight: 600; color: var(--texto); }
.fila-dup { display: flex; gap: 12px; flex-wrap: wrap; }
.dup { width: 148px; }
.dup .foto { width: 148px; height: 148px; border-radius: 8px; overflow: hidden; background: var(--celda); position: relative; }
.dup .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dup.cur .foto { box-shadow: 0 0 0 3px var(--acento); }
.dup p { margin: 6px 0 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dup p.gris { margin-top: 1px; color: var(--texto-2); font-size: 11.5px; }

/* ---------- pie ---------- */
#pie { flex: none; height: 30px; border-top: 1px solid var(--linea); display: flex; align-items: center; padding: 0 14px; gap: 12px; color: var(--texto-2); font-size: 12px; background: var(--fondo); z-index: 4; }
body.inicio #pie { opacity: 0; pointer-events: none; }
#conteo { font-variant-numeric: tabular-nums; white-space: nowrap; }
#ruta-pie { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; color: var(--texto-2); }
#ruta-pie b { color: var(--texto); font-weight: 500; margin-right: 8px; }
#tam { display: flex; align-items: center; gap: 7px; }
#tam svg { color: var(--texto-3); }
#tam input { -webkit-appearance: none; appearance: none; width: 96px; height: 14px; background: none; margin: 0; }
#tam input::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--sobre-2); }
#tam input::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; margin-top: -5px; border-radius: 50%; background: var(--panel-solido); box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.28); }
#tam input::-moz-range-track { height: 3px; border-radius: 2px; background: var(--sobre-2); }
#tam input::-moz-range-thumb { width: 13px; height: 13px; border: 0; border-radius: 50%; background: var(--panel-solido); box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.28); }

#seleccion { position: absolute; left: 50%; bottom: 44px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: opacity .16s, transform .2s cubic-bezier(.2,.8,.2,1); height: 44px; border-radius: 13px; background: var(--panel); backdrop-filter: saturate(1.8) blur(24px); -webkit-backdrop-filter: saturate(1.8) blur(24px); box-shadow: var(--sombra-panel); display: flex; align-items: center; padding: 0 7px 0 16px; gap: 4px; z-index: 8; white-space: nowrap; }
#seleccion.ver { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
#seleccion strong { font-weight: 600; margin-right: 10px; font-variant-numeric: tabular-nums; }
#seleccion .liso { color: var(--texto); }
#seleccion .boton { margin-left: 4px; }

/* ---------- menús y paneles ---------- */
.menu { position: fixed; z-index: 40; min-width: 180px; max-width: 320px; max-height: min(460px, 80vh); overflow-y: auto; padding: 5px; border-radius: 10px; background: var(--panel); backdrop-filter: saturate(1.8) blur(30px); -webkit-backdrop-filter: saturate(1.8) blur(30px); box-shadow: var(--sombra-panel); animation: aparecer .1s ease-out; }
@keyframes aparecer { from { opacity: 0; transform: scale(.97); } }
.menu button { display: flex; align-items: center; width: 100%; height: 26px; padding: 0 10px 0 26px; border-radius: 5px; text-align: left; position: relative; gap: 12px; white-space: nowrap; }
.menu button span { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.menu button small { color: var(--texto-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.menu button:hover, .menu button.foco { background: var(--acento); color: #fff; }
.menu button:hover small, .menu button.foco small { color: rgba(255,255,255,.75); }
.menu button.tilde::before { content: ""; position: absolute; left: 9px; top: 7px; width: 4px; height: 8px; border: solid currentColor; border-width: 0 1.6px 1.6px 0; transform: rotate(40deg); }
.menu hr { border: 0; border-top: 1px solid var(--linea); margin: 5px 10px; }
.menu .rango { padding: 6px 10px 6px 26px; display: flex; align-items: center; gap: 6px; color: var(--texto-2); font-size: 12px; }
.menu .rango input { height: 24px; border-radius: 5px; border: 1px solid var(--linea); background: var(--campo-foco); padding: 0 4px; font-size: 12px; color-scheme: light dark; }
.menu .titulo { padding: 4px 10px 3px 26px; font-size: 11px; color: var(--texto-3); font-weight: 600; }

#panel { position: fixed; top: 44px; right: 14px; width: 380px; max-height: calc(100vh - 90px); overflow-y: auto; z-index: 30; border-radius: 12px; background: var(--panel); backdrop-filter: saturate(1.8) blur(30px); -webkit-backdrop-filter: saturate(1.8) blur(30px); box-shadow: var(--sombra-panel); padding: 14px; animation: aparecer .12s ease-out; transform-origin: top right; }
#panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
.bib { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--linea); }
.bib:first-of-type { border-top: 0; }

<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (etiqueta, clase, texto) => { const e = document.createElement(etiqueta); if (clase) e.className = clase; if (texto != null) e.textContent = texto; return e; };
const ico = (n, clase = 'ico') => `<svg class="${clase}"><use href="#i-${n}"/></svg>`;
const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const nf = new Intl.NumberFormat('es-AR');
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const ff = { format: d => `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}` };
const PAGINA = 300, HUECO = 3, SEP = 44;
const F_VACIO = () => ({ tipo: '', lib: '', cliente: '', orient: '', fecha: '', desde: '', hasta: '', etiquetas: [], uso: '' });

const E = {
  q: '', similar: null, imagen: null, verTodo: false,
  f: { tipo: '', lib: '', cliente: '', orient: '', fecha: '', desde: '', hasta: '', etiquetas: [], uso: '' }, orden: '',
  items: [], total: 0, corte: 0, ms: 0, pedidas: new Set(), tanda: 0,
  sel: new Map(), cursor: -1, ancla: -1,
  lado: +(localStorage.getItem('lado') || 172),
  dups: false, listaDups: [],
};
let est = null;           // estado general que manda el servidor
let geo = { cols: 1, paso: 1, celda: 1 };

// ---------- pedidos ----------
async function api(ruta, cuerpo, crudo) {
  let r;
  try {
    r = await fetch(ruta, cuerpo === undefined && !crudo ? {} : { method: 'POST', headers: { 'x-buscador': '1', ...(crudo ? {} : { 'content-type': 'application/json' }) }, body: crudo || JSON.stringify(cuerpo) });
  } catch (e) { $('#caido').hidden = false; throw new Error('sin servidor'); }
  $('#caido').hidden = true;
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw new Error(j.error || 'Algo falló. Probá de nuevo.');
  return j;
}

function avisar(texto, ms = 2600) {
  const a = el('div', 'aviso', texto);
  $('#avisos').replaceChildren(a); // uno por vez: el nuevo reemplaza al anterior
  setTimeout(() => { a.classList.add('fuera'); setTimeout(() => a.remove(), 260); }, ms);
}

// ---------- utilidades de formato ----------
function fechaCorta(iso) { const p = String(iso).split('-'); return p.length === 3 ? `${+p[2]} ${MESES[+p[1] - 1]} ${p[0]}` : iso; }
function peso(b) { return b > 1073741824 ? (b / 1073741824).toFixed(1).replace('.', ',') + ' GB' : b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }
function reloj(s) { s = Math.round(s); const m = Math.floor(s / 60); return (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); }
function plural(n, uno, muchos) { return nf.format(n) + ' ' + (n === 1 ? uno : muchos); }
function bib(id) { return est && est.bibliotecas.find(b => b.id === id); }
function conectado(it) { const b = bib(it.l); return !!(b && b.conectada); }
function rutaDe(it) { const b = bib(it.l); const s = est.sep; return (b ? b.ruta : '') + s + (it.d ? it.d.split('/').join(s) + s : '') + it.n; }
function mini(it) { return '/mini/' + it.id + '?v=' + it.v + (it.k === 'v' && it.t != null ? '&t=' + it.t : ''); }
function lugar(it) { const b = bib(it.l); return [b ? b.nombre : '', ...(it.d ? it.d.split('/') : [])].filter(Boolean).join(' › '); }

// ---------- consulta ----------
function hayConsulta() { return !!(E.q.trim() || E.similar || E.imagen); }
function hayFiltros() { const f = E.f; return !!(f.tipo || f.lib || f.cliente || f.orient || f.fecha || f.uso || f.etiquetas.length); }
function filtrosApi() {
  const f = E.f, o = { tipo: f.tipo || undefined, lib: f.lib || undefined, orient: f.orient || undefined };
  if (f.cliente) o.cliente = f.cliente;
  if (f.uso) o.uso = f.uso;
  if (f.etiquetas.length) o.etiquetas = f.etiquetas;
  const hoy = new Date(), dia = d => d.toISOString().slice(0, 10);
  if (f.fecha === '7d') o.desde = dia(new Date(hoy - 7 * 864e5));
  else if (f.fecha === '30d') o.desde = dia(new Date(hoy - 30 * 864e5));
  else if (/^a\d{4}$/.test(f.fecha)) { o.desde = f.fecha.slice(1) + '-01-01'; o.hasta = f.fecha.slice(1) + '-12-31'; }
  else if (f.fecha === 'rango') { if (f.desde) o.desde = f.desde; if (f.hasta) o.hasta = f.hasta; }
  return o;
}
function consulta() { return { q: E.q, similar: E.similar ? E.similar.id : undefined, t: E.similar ? E.similar.t : undefined, imagen: E.imagen ? E.imagen.ref : undefined, filtros: filtrosApi(), orden: hayConsulta() ? E.orden : (E.orden === 'fecha_asc' ? 'fecha_asc' : 'fecha') }; }

let espera = 0;
function programar(ms = 90) { clearTimeout(espera); espera = setTimeout(buscar, ms); }

async function buscar() {
  clearTimeout(espera);
  const enGrilla = hayConsulta() || hayFiltros() || E.verTodo;
  document.body.classList.toggle('inicio', !enGrilla && !E.dups);
  pintarChips();
  if (!enGrilla) { E.tanda++; E.items = []; E.total = 0; E.corte = 0; E.cursor = -1; pintar(); pintarPie(); return; }
  const tanda = ++E.tanda;
  const t0 = performance.now();
  let r;
  try { r = await api('/api/buscar', { ...consulta(), desde: 0, limite: PAGINA }); }
  catch (e) { if (tanda === E.tanda && e.message !== 'sin servidor') avisar(e.message); return; }
  if (tanda !== E.tanda) return;
  E.items = new Array(r.total); r.items.forEach((it, i) => E.items[i] = it);
  E.total = r.total; E.ms = Math.round(performance.now() - t0); E.msMotor = r.ms;
  // con texto, lo que coincide de verdad va arriba y lo apenas relacionado va aparte
  E.corte = E.q.trim() && !E.similar && !E.imagen ? r.coinciden : r.total;
  E.pedidas = new Set([0]); E.cursor = -1; E.ancla = -1;
  $('#grilla').scrollTop = 0;
  generacion++;
  pintar(); pintarPie(); pintarNada();
}

async function cargarPagina(p) {
  if (E.pedidas.has(p)) return;
  E.pedidas.add(p);
  const tanda = E.tanda;
  try {
    const r = await api('/api/buscar', { ...consulta(), desde: p * PAGINA, limite: PAGINA });
    if (tanda !== E.tanda) return;
    r.items.forEach((it, i) => E.items[p * PAGINA + i] = it);
    pintar(); pintarPie();
  } catch { E.pedidas.delete(p); }
}

// ---------- grilla virtual ----------
const grilla = $('#grilla'), lienzo = $('#lienzo');
const vivas = new Map(), libres = [];
let generacion = 0, pendiente = false;

function crearCelda() {
  const c = el('div', 'c');
  c.innerHTML = `<img alt="" decoding="async" draggable="false"><div class="falta"></div><span class="dur"></span><span class="lejos" title="Disco desconectado">${ico('disco')}</span><span class="marca">${ico('tilde')}</span><span class="usada">Usada</span>`;
  const img = c.firstChild;
  img.onload = () => c.classList.add('ok');
  img.onerror = () => { c.classList.add('sin'); llenarFalta(c, c._it); };
  return c;
}
function llenarFalta(c, it) {
  const f = c.children[1];
  f.innerHTML = it ? ico(it.k === 'v' ? 'pelicula' : 'foto') + '<b></b>' : '';
  if (it) f.lastChild.textContent = it.n;
}
function vestir(c, i) {
  const it = E.items[i];
  const clave = it ? it.id + ':' + it.t + ':' + it.v : '';
  if (c._clave !== clave) {
    c._clave = clave; c._it = it;
    c.classList.remove('ok', 'sin');
    const img = c.firstChild;
    if (!it) { img.removeAttribute('src'); c.children[1].innerHTML = ''; }
    else if (it.m) img.src = mini(it);
    else { img.removeAttribute('src'); c.classList.add('sin'); llenarFalta(c, it); }
    c.classList.toggle('vid', !!it && it.k === 'v');
    if (it && it.k === 'v') c.children[2].innerHTML = ico('play', '') + (it.t != null && hayConsulta() ? reloj(it.t) : it.dur ? reloj(it.dur) : 'Video');
  }
  c.classList.toggle('off', !!it && !conectado(it));
  c.classList.toggle('us', !!it && !!it.us);
  c.classList.toggle('sel', !!it && E.sel.has(it.id));
  c.classList.toggle('cur', i === E.cursor);
}
function medir() {
  const ancho = grilla.clientWidth - 32;
  const cols = Math.max(1, Math.floor((ancho + HUECO) / (E.lado + HUECO)));
  const celda = (ancho - HUECO * (cols - 1)) / cols;
  geo = { cols, celda, paso: celda + HUECO };
}
// La grilla tiene hasta dos tramos: coincidencias y, debajo de un separador, relacionadas.
function haySeparador() { return E.corte < E.total; }
function filasA() { return Math.ceil(E.corte / geo.cols); }
function yBase() { return filasA() * geo.paso + (haySeparador() ? SEP : 0); }
function posDe(i) {
  if (i < E.corte) return [(i % geo.cols) * geo.paso, Math.floor(i / geo.cols) * geo.paso];
  const j = i - E.corte;
  return [(j % geo.cols) * geo.paso, yBase() + Math.floor(j / geo.cols) * geo.paso];
}
function pintar() {
  pendiente = false;
  medir();
  const filasB = Math.ceil((E.total - E.corte) / geo.cols);

function hojaExportar(items) {
  const velo = el('div'); velo.id = 'velo';
  velo.innerHTML = `<div id="hoja" role="dialog"><h2></h2><p>Se copian a la carpeta que elijas. Los originales quedan donde están.</p><div class="fila"><input class="entrada" spellcheck="false"><button class="boton" data-a="elegir">Elegir…</button></div><div class="pie-hoja"><button class="boton" data-a="no">Cancelar</button><button class="boton primario" data-a="si">Exportar</button></div></div>`;
  velo.querySelector('h2').textContent = items.length === 1 ? 'Exportar 1 copia' : `Exportar ${nf.format(items.length)} copias`;
  const i = velo.querySelector('input'); i.value = localStorage.getItem('destino') || est.carpetaSugerida;
  const cerrar = () => velo.remove();
  velo.addEventListener('mousedown', e => { if (e.target === velo) cerrar(); });
  velo.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Escape') cerrar(); if (e.key === 'Enter') velo.querySelector('[data-a="si"]').click(); });
  velo.addEventListener('click', async e => {
    const a = e.target.dataset.a;
    if (a === 'no') cerrar();
    if (a === 'elegir') { try { const r = await api('/api/elegir-carpeta', { titulo: 'Elegí dónde guardar las copias' }); if (r.ruta) i.value = r.ruta; else if (r.sinDialogo) { i.focus(); i.select(); } } catch {} }
    if (a === 'si') {
      e.target.disabled = true; e.target.textContent = 'Copiando…';
      try {
        const r = await api('/api/exportar', { ids: items.map(x => x.id), destino: i.value.trim() });
        localStorage.setItem('destino', i.value.trim());
        cerrar();
        const nombre = r.destino.split(est.sep).filter(Boolean).pop();
        avisar(`${plural(r.copiadas, 'copia', 'copias')} en "${nombre}"` + (r.omitidas.length ? `. ${plural(r.omitidas.length, 'quedó', 'quedaron')} afuera: ${r.omitidas[0].motivo}.` : ''), r.omitidas.length ? 6000 : 3200);
      } catch (err) { e.target.disabled = false; e.target.textContent = 'Exportar'; avisar(err.message, 4500); }
    }
  });
  document.body.append(velo); i.focus(); i.select();
}

// ---------- teclado ----------
addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, enCampo = document.activeElement === q, enOtroCampo = !enCampo && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if ($('#velo')) return;
  if (etq && e.key === 'Escape') { e.preventDefault(); return cerrarEtq(); }
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); return enfocarBusqueda(); }
  if (e.key === 'Escape') {
    e.preventDefault();
    if (menu) return cerrarMenu();
    if (vr) return cerrarVista();
    if (panel) return cerrarPanel();
    if (E.sel.size) { E.sel.clear(); pintar(); return pintarPie(); }
    if (E.dups) { salirDups(); return buscar(); }
    if (hayConsulta() || hayFiltros() || E.verTodo) { E.f = F_VACIO(); return limpiarTodo(); }
    return q.focus();
  }
  if (enOtroCampo) return;
  if (enCampo) {
    if (e.key === 'ArrowDown' || (e.key === 'Enter' && E.total)) { e.preventDefault(); grilla.focus(); moverCursor(Math.max(0, E.cursor)); }
    else if (e.key === 'Backspace' && !q.value && (E.similar || E.imagen)) { quitarFicha(); buscar(); }
    return;
  }
  if (e.key === '/') { e.preventDefault(); return enfocarBusqueda(); }
  const n = E.dups ? E.listaDups.length : E.total, cols = E.dups ? 1 : geo.cols;
  const porPagina = Math.max(1, Math.floor(grilla.clientHeight / geo.paso)) * cols;
  const mov = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: vr ? 1 : cols, ArrowUp: vr ? -1 : -cols, PageDown: porPagina, PageUp: -porPagina }[e.key];
  if (mov) {
    e.preventDefault();
    if (E.cursor < 0) return moverCursor(0);
    if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && !vr && !E.dups) {
      const d = vertical(E.cursor, e.key === 'ArrowUp' ? -1 : 1);
      if (d < 0) { E.cursor = -1; pintar(); pintarPie(); return enfocarBusqueda(); }
      return moverCursor(d, e.shiftKey);
    }
    return moverCursor(E.cursor + mov, e.shiftKey);
  }
  if (!mod && e.key.toLowerCase() === 't' && objetivos().length) { e.preventDefault(); return abrirEtq(); }
  if (!mod && e.key.toLowerCase() === 'u' && objetivos().length) { e.preventDefault(); return alternarUso(); }
  if (e.key === 'Home') { e.preventDefault(); return moverCursor(0); }
  if (e.key === 'End') { e.preventDefault(); return moverCursor(n - 1); }
  if (e.key === ' ') { e.preventDefault(); if (vr) cerrarVista(); else { if (E.cursor < 0 && n) moverCursor(0); abrirVista(); } return; }
  if (e.key === 'Enter') { e.preventDefault(); return accion('abrir', actual()); }
  if (mod && e.key.toLowerCase() === 'a' && !E.dups) { e.preventDefault(); E.items.forEach(it => it && E.sel.set(it.id, it)); pintar(); return pintarPie(); }
  if (mod && e.key.toLowerCase() === 'c' && !String(getSelection())) { e.preventDefault(); return copiarRutas(objetivos()); }
  if (e.key.length === 1 && !mod && !e.altKey && /\S/.test(e.key) && !vr) { q.focus(); } // escribir en cualquier lado lleva a la búsqueda
});

// ---------- estado general ----------
function textoIndexado(largo) {
  const x = est.indexado;
  if (x.fase === 'revisando') return 'Revisando ' + (x.biblioteca || 'las carpetas') + '…';
  if (x.fase === 'completando') return 'Completando datos…';
  const falta = x.falta ? (x.falta < 90 ? `falta ${Math.max(5, Math.round(x.falta / 5) * 5)} s` : `faltan ${Math.round(x.falta / 60)} min`) : '';
  return (largo ? 'Indexando ' : '') + `${nf.format(x.hechas)} de ${nf.format(x.total)}` + (falta ? ' · ' + falta : '') + (largo && x.porSeg ? ` · ${String(x.porSeg).replace('.', ',')} por segundo. Se puede buscar mientras tanto.` : '');
}
function pintarInicio() {
  const total = est.fotos + est.videos;
  $('#vacio-total').hidden = est.bibliotecas.length > 0;
  const ej = $('#ejemplos'); ej.innerHTML = '';
  const lista = est.ejemplos.slice(0, 6);
  for (const e of lista) {
    const b = el('button', 'ejemplo'); const m = el('img'); m.alt = ''; m.src = '/mini/' + e.id; b.append(m, e.frase);
    b.onclick = () => { q.value = E.q = e.frase; buscar(); grilla.focus(); };
    ej.append(b);
  }
  if (!lista.length && total) for (const c of est.clientes.slice(0, 6)) { const b = el('button', 'ejemplo solo-texto', c.nombre); b.onclick = () => { q.value = E.q = c.nombre; buscar(); }; ej.append(b); }
  const r = $('#resumen'); r.innerHTML = '';
  if (total) {
    const partes = [plural(est.fotos, 'foto', 'fotos')]; if (est.videos) partes.push(plural(est.videos, 'video', 'videos'));
    const v = el('button', 'enlace', 'Ver todo'); v.onclick = () => { E.verTodo = true; buscar(); grilla.focus(); };
    r.append(partes.join(' y ') + ' en ' + plural(est.bibliotecas.length, 'biblioteca', 'bibliotecas'), el('span', '', '·'), v);
  } else if (est.bibliotecas.length) r.append(est.indexado.activo ? 'Indexando por primera vez. En un rato ya se puede buscar.' : 'Las bibliotecas no tienen fotos ni videos todavía.');
}
let ultimaVersion = 0, ultimoPulso = 0, firmaInicio = '';
async function refrescar() {
  let nuevo;
  try { nuevo = await api('/api/estado'); } catch { return; }
  const cambioLibs = !est || JSON.stringify(est.bibliotecas) !== JSON.stringify(nuevo.bibliotecas);
  est = nuevo;
  const x = est.indexado, ind = $('#indexando');
  ind.hidden = !x.activo;
  if (x.activo) {
    ind.querySelector('.avance').style.strokeDashoffset = 37.7 * (1 - (x.total ? x.hechas / x.total : .03));
    ind.lastElementChild.textContent = x.fase === 'revisando' ? 'Revisando…' : x.fase === 'completando' ? 'Completando…' : textoIndexado(false);
  }
  const fi = JSON.stringify([est.ejemplos, est.fotos, est.videos, est.bibliotecas.length, x.activo]);
  if (fi !== firmaInicio) { firmaInicio = fi; pintarInicio(); }
  pintarChips(); pintarPanel();
  if (cambioLibs) { pintar(); pintarPie(); }
  // si el índice cambió mientras se mira una búsqueda, se actualiza sin mover el scroll (como mucho cada 4 s)
  if (est.version !== ultimaVersion) {
    const antes = ultimaVersion; ultimaVersion = est.version;
    if (antes && !document.body.classList.contains('inicio') && !E.dups && !vr && Date.now() - ultimoPulso > 4000 && grilla.scrollTop < 40 && E.cursor < 0) { ultimoPulso = Date.now(); const s = grilla.scrollTop; await buscar(); grilla.scrollTop = s; }
  }
}
async function latido() { await refrescar(); setTimeout(latido, document.hidden ? 8000 : est && est.indexado.activo ? 1200 : 5000); }

// ---------- arranque ----------
const tam = $('#tam input');
tam.value = E.lado;
tam.addEventListener('input', () => {
  const primera = Math.floor(grilla.scrollTop / geo.paso) * geo.cols;
  E.lado = +tam.value; localStorage.setItem('lado', E.lado);
  medir(); grilla.scrollTop = Math.floor(primera / geo.cols) * geo.paso; pintar();
});
latido().then(() => { pintarChips(); q.focus(); });
</script>
